name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GOOGLE_SERVICES_JSON repository secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Restore stable debug signing key
        run: base64 --decode blackout-debug.keystore.b64 > app/blackout-debug.keystore
      - name: Build debug APK
        env:
          BLACKOUT_KEYSTORE_PATH: blackout-debug.keystore
          BLACKOUT_KEYSTORE_PASSWORD: blackoutdebug
          BLACKOUT_KEY_ALIAS: blackout
          BLACKOUT_KEY_PASSWORD: blackoutdebug
          BLACKOUT_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlackoutUA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
